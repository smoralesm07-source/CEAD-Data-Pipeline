name: CEAD Data Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub usa UTC. Revisión semanal: lunes 12:20 UTC.
    - cron: '20 12 * * 1'

permissions:
  contents: write

concurrency:
  group: cead-data-pipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Restaurar estado técnico anterior
        shell: bash
        run: |
          git fetch origin data || true
          mkdir -p data/processed data/history data/evidence
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git show origin/data:data/processed/manifest.json > data/previous_manifest.json 2>/dev/null || true
            for f in \
              data/processed/cead_direct_monthly.parquet \
              data/processed/cead_direct_annual_ytd.parquet \
              data/processed/cead_document_catalog.json \
              data/processed/cead_enrichment_manifest.json; do
              mkdir -p "$(dirname "$f")"
              git show "origin/data:$f" > "$f" 2>/dev/null || rm -f "$f"
            done
            git ls-tree -r --name-only origin/data data/history | while read -r f; do
              [ -z "$f" ] && continue
              mkdir -p "$(dirname "$f")"
              git show "origin/data:$f" > "$f" || true
            done
          fi

      - name: Ejecutar pruebas
        run: pytest -q

      - name: Descargar, validar, normalizar y enriquecer CEAD
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python run.py

      - name: Generar referencia CEAD 2025 para QA de mirrors
        run: python scripts/reference_2025.py

      - name: Publicar controles y registro de fuentes v0.3
        shell: bash
        run: |
          mkdir -p data/processed
          cp config/cead_2026_official_controls.json data/processed/cead_2026_official_controls.json
          cp config/source_registry_v03.json data/processed/source_registry_v03.json
          cp config/cead_enrichment_v1.json data/processed/cead_enrichment_v1.json

      - name: Publicar snapshot técnico
        shell: bash
        run: |
          git config user.name "cead-data-bot"
          git config user.email "cead-data-bot@users.noreply.github.com"
          TMP=$(mktemp -d)
          mkdir -p "$TMP/data"
          cp -R data/processed "$TMP/data/"
          cp -R data/evidence "$TMP/data/"
          cp -R data/history "$TMP/data/"
          cp -R public "$TMP/"
          git checkout --orphan data-tmp
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf data public
          cp -R "$TMP"/* .
          git add data public
          git commit -m "cead: snapshot semanal $(date -u +%F)" || true
          git push origin HEAD:data --force
